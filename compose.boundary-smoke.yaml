services:
  gateway:
    build: .
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/v1/status')",
        ]
      interval: 1s
      timeout: 1s
      retries: 20
    networks:
      - eval

  agent-probe:
    build: .
    command: ["python", "-m", "demo.boundary_probe"]
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - eval

networks:
  eval:
    internal: true
